# This file is included inside the seating.example.com server block.

client_max_body_size 2m;

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

location = / {
    try_files /index.html =404;
    more_set_headers "Cache-Control: private, no-store";
}

location ~ ^/self-check-in/[a-zA-Z0-9-]+/?$ {
    try_files /index.html =404;
    more_set_headers "Cache-Control: private, no-store";
}

location = /self-check-in {
    try_files /index.html =404;
    more_set_headers "Cache-Control: private, no-store";
}

location = /self-check-in/ {
    try_files /index.html =404;
    more_set_headers "Cache-Control: private, no-store";
}

location = /api/auth/login {
    limit_req zone=seating_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    more_set_headers "Cache-Control: private, no-store";
}

location ^~ /api/public/self-check-in {
    limit_req zone=seating_public_checkin burst=1000 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    more_set_headers "Cache-Control: private, no-store";
}

location ^~ /api/ {
    limit_req zone=seating_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    more_set_headers "Cache-Control: private, no-store";
}

location ~* ^/assets/.*\.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
    expires 30d;
    more_set_headers "Cache-Control: private, max-age=2592000, immutable";
}

location ~ ^/(?!api(?:/|$)|assets(?:/|$)).+ {
    try_files /index.html =404;
    more_set_headers "Cache-Control: private, no-store";
}
